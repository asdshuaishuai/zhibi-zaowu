<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>执笔 3.0 · 完整可交互原型</title>
</head>
<body style="margin:0;background:#101114">
<div id="zhibi-app" class="za">
<style>
  /* ── 执笔 3.0 可交互原型 · 墨底/宣纸/朱砂 ── */
  .za { --bg:#17181c; --panel:#1e2026; --panel2:#24262d; --line:#2e3138; --text:#d8d5cf; --dim:#8e8b85; --faint:#5d5b57;
       --accent:#c96f4a; --accent-soft:rgba(201,111,74,.14); --green:#7fae72; --green-soft:rgba(127,174,114,.12);
       --blue:#6f9bc4; --blue-soft:rgba(111,155,196,.12); --purple:#a08cc0; --red:#c0605c; --red-soft:rgba(192,96,92,.12);
       font-family:-apple-system,"PingFang SC","Segoe UI",sans-serif; font-size:13px; line-height:1.55; color:var(--text);
       background:var(--bg); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; height:760px; user-select:none; }
  .za .za-prose, .za .za-cbody, .za .za-bubble { user-select:text; }
  .za * { box-sizing:border-box; margin:0; padding:0; }
  .za .serif { font-family:"Noto Serif SC","Songti SC",serif; }
  .za button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  .za ::selection { background:rgba(111,155,196,.35); }

  .za-tb { display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex:none; }
  .za-dots { display:flex; gap:6px; } .za-dots i { width:11px; height:11px; border-radius:50%; }
  .za-dots i:nth-child(1){background:#ec6a5e}.za-dots i:nth-child(2){background:#f4bf4f}.za-dots i:nth-child(3){background:#61c554}
  .za-tb .nm { color:var(--dim); font-size:12px; } .za-tb .nm b { color:var(--text); font-weight:500; }
  .za-tb .sp { flex:1; }
  .za-ib { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:7px; border:1px solid var(--line); background:var(--panel2); color:var(--dim); font-size:11.5px; }
  .za-ib:hover { color:var(--text); border-color:#3a3d45; }
  .za-ib.pri { background:var(--accent-soft); border-color:rgba(201,111,74,.45); color:var(--text); }
  .za-chip { display:inline-flex; align-items:center; font-size:10.5px; border-radius:9px; padding:1px 9px; line-height:17px; border:1px solid var(--line); color:var(--dim); }
  .za-chip.g { color:var(--green); border-color:rgba(127,174,114,.35); }
  .za-chip.b { color:var(--blue); border-color:rgba(111,155,196,.4); }
  .za-chip.r { color:var(--red); border-color:rgba(192,96,92,.4); }
  .za-chip.a { color:var(--accent); border-color:rgba(201,111,74,.45); }
  .za-badge { background:var(--accent); color:#fff; font-size:10px; border-radius:8px; padding:0 6px; line-height:15px; }

  .za-body { display:flex; flex:1; min-height:0; }
  .za-side { width:172px; flex:none; background:var(--panel); border-right:1px solid var(--line); padding:9px 7px; overflow-y:auto; }
  .za-side .sec { font-size:10px; color:var(--faint); letter-spacing:.14em; margin:11px 7px 4px; }
  .za-side .sec:first-child { margin-top:0; }
  .za-nav { display:flex; align-items:center; gap:7px; width:100%; text-align:left; padding:5px 8px; border-radius:7px; color:var(--dim); font-size:12px; }
  .za-nav:hover { color:var(--text); }
  .za-nav.on { background:var(--accent-soft); color:var(--text); }
  .za-nav .ch { margin-left:auto; font-size:10px; color:var(--faint); }
  .za-nav.on .ch { color:var(--accent); }

  .za-main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .za-view { flex:1; min-height:0; overflow-y:auto; }

  /* 书架 */
  .za-shelf { padding:18px 22px 24px; }
  .za-shelf h1 { font-size:18px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
  .za-books { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
  .za-book { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; text-align:left; transition:transform .15s,border-color .15s; }
  .za-book:hover { transform:translateY(-2px); border-color:rgba(201,111,74,.5); }
  .za-cover { aspect-ratio:3/4; position:relative; display:grid; place-items:center; }
  .za-cover .ci { position:absolute; inset:0; }
  .za-cover .ct { position:relative; writing-mode:vertical-rl; font-size:21px; letter-spacing:.3em; color:#e8ddca; text-shadow:0 2px 12px rgba(0,0,0,.5); }
  .za-cover .ca { position:absolute; bottom:9px; right:11px; font-size:9px; letter-spacing:.2em; color:rgba(232,221,202,.5); }
  .za-bmeta { padding:9px 11px 11px; }
  .za-bmeta .bt { font-size:12.5px; font-weight:600; }
  .za-bmeta .bi { margin-top:3px; font-size:10.5px; color:var(--faint); }

  /* 编辑器 */
  .za-edhead { display:flex; align-items:baseline; gap:10px; padding:13px 20px 6px; }
  .za-edhead h2 { font-size:15px; font-weight:600; }
  .za-edhead .mt { color:var(--faint); font-size:11px; }
  .za-edhead .sp { flex:1; }
  .za-prose { max-width:640px; margin:0 auto; padding:4px 20px 8px; }
  .za-prose p { text-indent:2em; font-size:14px; line-height:1.85; margin-bottom:11px; border-radius:6px; }
  .za-prose .pend { display:inline-block; width:26px; text-align:center; color:var(--faint); opacity:0; cursor:pointer; text-indent:0; font-style:normal; }
  .za-prose p:hover .pend { opacity:.7; }
  .za-ghost { color:#6e6a63; font-style:italic; }
  .za-caret { color:var(--accent); font-style:normal; animation:zacaret 1.1s steps(1) infinite; }
  @keyframes zacaret { 50%{opacity:0} }
  .za-kh { display:inline-flex; gap:4px; vertical-align:2px; margin-left:7px; font-size:10px; font-style:normal; color:var(--dim); border:1px solid var(--line); background:var(--panel2); border-radius:5px; padding:0 6px; line-height:17px; }
  .za-kh kbd { font-family:inherit; color:var(--accent); }
  .za-inkdot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.55; vertical-align:3px; margin-left:6px; }
  .za-settled { background:var(--green-soft); border-radius:4px; }
  .za-del { color:var(--faint); text-decoration:line-through; }

  .za-branches { max-width:640px; margin:2px auto 10px; }
  .za-bh { display:flex; align-items:center; gap:7px; margin-bottom:8px; font-size:11.5px; color:var(--dim); flex-wrap:wrap; }
  .za-bh .sp { flex:1; }
  .za-brow { display:flex; gap:9px; }
  .za-bcard { flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; text-align:left; }
  .za-bcard.sel { border-color:var(--accent); background:var(--accent-soft); }
  .za-bcard .bt { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; margin-bottom:5px; }
  .za-bcard .dot { width:7px; height:7px; border-radius:50%; }
  .za-bcard .bx { font-size:11px; color:var(--dim); line-height:1.6; min-height:74px; }
  .za-bcard .bf { margin-top:7px; font-size:10px; color:var(--faint); }
  .za-bcard.picking { animation:zapulse .5s ease; }
  @keyframes zapulse { 0%{transform:scale(.98)} 50%{transform:scale(1.01)} 100%{transform:scale(1)} }

  .za-edtools { display:flex; gap:6px; padding:8px 20px; border-top:1px solid var(--line); background:var(--panel); flex-wrap:wrap; flex:none; }
  .za-statusbar { display:flex; align-items:center; gap:9px; padding:6px 20px; background:var(--panel); border-top:1px solid var(--line); font-size:11px; color:var(--dim); flex:none; min-height:30px; }

  /* 通用面板/表格 */
  .za-pad { padding:16px 20px 22px; }
  .za-panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:13px; }
  .za-panel h3 { font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:9px; margin-bottom:10px; flex-wrap:wrap; }
  .za-panel h3 .n { font-weight:400; color:var(--faint); font-size:11px; }
  .za-table { width:100%; border-collapse:collapse; font-size:12px; }
  .za-table th { text-align:left; color:var(--faint); font-weight:500; font-size:10.5px; padding:5px 9px; border-bottom:1px solid var(--line); }
  .za-table td { padding:6px 9px; border-bottom:1px solid rgba(46,49,56,.5); vertical-align:top; }
  .za-mono { font-family:ui-monospace,monospace; font-size:11px; color:var(--faint); }
  .za-bar { height:8px; border-radius:4px; background:rgba(255,255,255,.06); position:relative; overflow:hidden; }
  .za-bar i { position:absolute; inset:0 auto 0 0; border-radius:4px; }

  /* Dock */
  .za-dock { width:320px; flex:none; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .za-dock.narrow { width:250px; }
  .za-zb { position:absolute; right:0; top:0; bottom:0; width:4px; cursor:col-resize; }
  .za-dh { display:flex; align-items:center; gap:7px; padding:8px 11px; border-bottom:1px solid var(--line); flex:none; }
  .za-dh b { font-size:12px; font-weight:600; }
  .za-dh .sp { flex:1; }
  .za-dtabs { display:flex; gap:2px; background:var(--panel2); border-radius:8px; padding:2px; }
  .za-dtabs button { font-size:10.5px; color:var(--faint); padding:2px 10px; border-radius:6px; }
  .za-dtabs button.on { background:var(--accent-soft); color:var(--text); }
  .za-dbody { flex:1; min-height:0; overflow-y:auto; padding:9px 10px; display:flex; flex-direction:column; gap:5px; }
  .za-rh { display:flex; align-items:center; gap:6px; margin:6px 0 1px; color:var(--accent); font-size:10.5px; font-weight:600; }
  .za-rh .ln { flex:1; height:1px; background:var(--line); }
  .za-rh .t { color:var(--faint); font-weight:400; }
  .za-bubble { background:var(--panel2); border-radius:8px; padding:6px 9px; font-size:11px; color:var(--dim); line-height:1.5; }
  .za-bubble b { color:var(--text); font-weight:500; }
  .za-bubble .sub { display:block; font-size:9.5px; color:var(--faint); margin-top:2px; }
  .za-bubble.tool { background:var(--accent-soft); }
  .za-bubble.ok { background:var(--green-soft); }
  .za-bubble.err { background:var(--red-soft); color:var(--red); }
  .za-dock .live { border-top:1px solid var(--line); padding:8px 11px 10px; background:rgba(111,155,196,.06); flex:none; }
  .za-dock .lv { display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--blue); font-weight:600; }
  .za-dock .spin { width:10px; height:10px; border:2px solid var(--blue); border-top-color:transparent; border-radius:50%; display:inline-block; animation:zaspin .9s linear infinite; }
  @keyframes zaspin { to{transform:rotate(360deg)} }
  .za-dock pre { margin-top:5px; font-family:ui-monospace,monospace; font-size:9.5px; color:var(--faint); line-height:1.5; white-space:pre-wrap; max-height:70px; overflow:hidden; }

  /* 收件箱提案卡 */
  .za-pcard { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:11px; padding:11px 13px; margin-bottom:10px; }
  .za-pcard.acc { border-left-color:var(--green); opacity:.8; }
  .za-pcard.rej { border-left-color:var(--red); opacity:.6; }
  .za-phead { display:flex; align-items:center; gap:8px; }
  .za-pkind { font-size:10px; border-radius:5px; padding:1px 8px; background:var(--accent-soft); color:var(--accent); }
  .za-ptitle { font-size:12.5px; font-weight:600; }
  .za-pmeta { margin-left:auto; font-size:10px; color:var(--faint); }
  .za-pbody { margin-top:6px; font-size:11.5px; color:var(--dim); }
  .za-prow { display:flex; align-items:center; gap:7px; padding:3px 0; }
  .za-cat { font-size:10px; border-radius:5px; padding:0 8px; line-height:17px; background:var(--blue-soft); color:var(--blue); flex:none; }
  .za-pact { display:flex; gap:7px; margin-top:9px; align-items:center; }
  .za-btn { border-radius:7px; padding:3px 12px; font-size:11.5px; border:1px solid var(--line); background:var(--panel2); color:var(--dim); }
  .za-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500; }
  .za-btn.gh { border-color:transparent; background:transparent; }

  /* 设定 */
  .za-canon { display:flex; gap:12px; min-height:380px; }
  .za-cgroups { width:190px; flex:none; border-right:1px solid var(--line); padding-right:10px; }
  .za-cg { font-size:11px; color:var(--faint); letter-spacing:.1em; margin:9px 4px 4px; }
  .za-ci { display:block; width:100%; text-align:left; font-size:12px; color:var(--dim); padding:4px 8px; border-radius:6px; }
  .za-ci:hover { color:var(--text); }
  .za-ci.on { background:var(--accent-soft); color:var(--text); }
  .za-cbody { flex:1; min-width:0; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:13px 15px; font-size:12.5px; line-height:1.8; }
  .za-cbody h4 { font-size:13px; margin-bottom:8px; }
  .za-cbody .cm { display:inline-block; font-size:10px; border-radius:5px; padding:0 8px; line-height:17px; background:var(--blue-soft); color:var(--blue); margin-left:8px; vertical-align:2px; }

  /* 弹层 */
  .za-modal { position:absolute; inset:0; background:rgba(0,0,0,.55); display:grid; place-items:center; z-index:50; }
  .za-modal .mbox { width:340px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .za-modal h4 { font-size:14px; margin-bottom:10px; }
  .za-modal input, .za-modal textarea { width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px; color:var(--text); font:inherit; font-size:12px; padding:6px 10px; outline:none; }
  .za-modal .mrow { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }

  .za-selmenu { position:fixed; width:300px; background:#22242b; border:1px solid #3a3d45; border-radius:11px; box-shadow:0 10px 30px rgba(0,0,0,.5); padding:10px 11px 9px; z-index:60; }
  .za-selmenu .t { font-size:10px; color:var(--faint); margin-bottom:6px; }
  .za-selmenu .row { display:flex; gap:5px; flex-wrap:wrap; }
  .za-selmenu .mb { border:1px solid #3a3d45; background:#1e2026; color:var(--text); font-size:11.5px; border-radius:6px; padding:3px 10px; }
  .za-selmenu .mb.hl { border-color:rgba(201,111,74,.5); background:var(--accent-soft); }
  .za-selmenu input { margin-top:7px; width:100%; background:var(--bg); border:1px solid var(--line); border-radius:6px; color:var(--dim); font-size:11px; padding:4px 8px; outline:none; }
  .za-selmenu .land { display:flex; align-items:center; gap:5px; margin-top:8px; font-size:10px; color:var(--faint); flex-wrap:wrap; }
  .za-selmenu .land span.l { border:1px solid #3a3d45; border-radius:5px; padding:1px 8px; color:var(--dim); }
  .za-selmenu .land span.l.on { border-color:rgba(111,155,196,.55); color:var(--blue); background:var(--blue-soft); }

  .za-toasts { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; z-index:70; align-items:center; }
  .za-toast { background:#2a2d34; border:1px solid #3a3d45; color:var(--text); font-size:11.5px; border-radius:9px; padding:5px 14px; box-shadow:0 6px 18px rgba(0,0,0,.4); animation:zain .18s ease; }
  @keyframes zain { from { opacity:0; transform:translateY(6px);} }
  .za-focus .za-side, .za-focus .za-dock { display:none; }
  .za-stat-bars { display:flex; align-items:flex-end; gap:10px; height:110px; padding:4px 6px 0; }
  .za-sbar { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .za-sbar i { display:block; width:100%; max-width:34px; border-radius:5px 5px 0 0; background:var(--accent-soft); border-top:2px solid var(--accent); }
  .za-sbar span { font-size:9.5px; color:var(--faint); }
  @media (prefers-reduced-motion: reduce) { .za * { animation:none !important; transition:none !important; } }
</style>

<div class="za-tb">
  <div class="za-dots"><i></i><i></i><i></i></div>
  <span class="nm" id="za-crumb">执笔 3.0 — <b>书架</b></span>
  <span class="sp"></span>
  <span class="za-chip" id="za-dshchip">DSH：未启动</span>
  <button class="za-ib" data-act="focus-toggle" title="只留稿纸">专注</button>
  <button class="za-ib" data-act="nav" data-screen="settings">设置</button>
</div>

<div class="za-body" id="za-body"></div>

<div class="za-statusbar" id="za-status"></div>
<div class="za-toasts" id="za-toasts"></div>
<div id="za-layers"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const root = $('zhibi-app');
  const now = () => { const d = new Date(); const p = (x)=>String(x).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); };
  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  /* ───── 状态 ───── */
  const S = {
    screen: 'shelf', chapter: 12, dockOpen: true, dockTab: 'traj', focus: false,
    running: null, stream: '',
    chapters: [
      { n:1, t:'交付说明', st:'定稿', w:120 }, { n:2, t:'北境来客', st:'定稿', w:3200 },
      { n:3, t:'雪夜葬刀', st:'定稿', w:3100 }, { n:11, t:'旧账', st:'已润色', w:2980 },
      { n:12, t:'断刀', st:'写作中', w:3214 }, { n:13, t:'旧约', st:'未规划', w:0 },
    ],
    prose: [
      { t:'沈砚按着刀柄走进雨里。巷口的灯笼在风里晃，把他的影子拉长又压短，像一根随时会断的线。三个月了，那把断刀始终没有离开过他的腰——刀是师父留下的，缺口处还沾着北境的铁锈。', ink:true },
      { t:'酒肆里坐着的人比他想的要多。靠窗那桌在赌钱，押的是明日漕帮开仓的价；角落里两个短打汉子压着嗓子说话，说的却是「赤星军」三个字。沈砚要了一角酒，背对着他们坐下，耳朵却支棱着。', ink:false },
      { t:'「听说了吗，雁回山那边的老观又燃了灯。」', ink:false },
      { t:'「嘘——那灯三十年前就该灭了。」', ink:false },
      { t:'沈砚的手指在刀柄上收紧了一分。老观燃灯，是师父当年留下的暗号：灯亮，就是有人回来了。他没有回头，只是把酒一口饮尽。', ink:false },
    ],
    ghostSentences: [
      '他没有回头，只是把酒一口饮尽——师兄，你终究还是走到这一步了吗。',
      '灯影里，他仿佛看见三年前那个替他挡下第一刀的人。',
      '刀在腰间轻轻一颤，像也在等一个答案。',
    ],
    ghostIdx: 0, ghostPara: null,
    branches: null, branchSet: 0, branchSel: null,
    branchPool: [
      [
        { k:'A · 复仇线', c:'#c96f4a', tag:'张力↑', x:'沈砚连夜出城，直奔雁回山。他要在灯灭之前见到那个人——哪怕刀刃相向。山道上雪没到脚踝，他想起的是师父咽气前那句「别去找他」。', f:'接 F03 伏笔 · 新埋「观灯人身份」' },
        { k:'B · 师门线', c:'#6f9bc4', tag:'信息差↑', x:'来的不是师兄，是师兄的徒弟。少年跪在雪里，交出半块虎符，说师门三十年前的旧账，要沈砚亲手去翻。灯，是照给活人看的路。', f:'回收 E07 · 揭读者未知层' },
        { k:'C · 温情线', c:'#7fae72', tag:'喘息位', x:'沈砚没有动。他给灯留了一夜的时间——若天亮灯还亮着，他便回去；若灭了，从此江湖两清。这一夜他和酒肆的赌客们掷了一回骰子。', f:'节奏降速 · 铺人物日常面' },

  function traj(kind, text, sub) {
    S.traj.push({ kind, text, sub, time: now() });
    if (S.traj.length > S.trajCap) S.traj.shift();
    if ($('za-dbody')) { const d = $('za-dbody'); d.scrollTop = d.scrollHeight; }
  }
  function aiRun(cap, steps, done) {
    S.aiRunningN++;
    renderStatus();
    traj('turn', cap, null);
    let i = 0, t = 300;
    const step = () => {
      if (i >= steps.length) {
        S.aiRunningN = Math.max(0, S.aiRunningN - 1);
        traj('ok', `${cap} 完成 · 新登记 1 条提案，待作者审阅`);
        renderStatus(); renderDock();
        if (done) done();
        return;
      }
      const s = steps[i++];
      if (s) traj(s.k || 'info', s.t, s.sub);
      setTimeout(step, s && s.wait || 550);
    };
    setTimeout(step, t);
  }

  function doSelAction(kind, custom) {
    const sel = S.lastSel;   // 先取选区再关菜单（closeSel 会清 lastSel）
    closeSel();
    if (!sel) return;
    ensureDSH();
    aiRun(`选区创作 · ${kind}`, [
      { k:'info', t:`读取选区（${sel.len} 字）${custom ? ' · 自定义指令：' + custom : selMenuDefs[kind] || ''}` },
      { k:'tool', t:'调用 zhibi_rewrite（M3 工具）', sub:'diff 预览模式 · 采纳前自动快照' },
    ], () => {
      // 应用：把选中文本替换为“deepened”版本并高亮
      const p = S.prose[sel.p];
      if (p && p.t.includes(sel.text)) {
        const better = sel.text.length > 12
          ? sel.text.slice(0, Math.ceil(sel.text.length * 1.35)).replace(/。$/, '') + '，' + (kind === '拉深' ? '雨声忽然大了，把整条巷子的灯火都搅成一片模糊的暖黄。' : kind === '缩写' ? '' : '细节处又多了一层不易察觉的凉意。') + '。'
          : sel.text + '（改）';
        p.t = p.t.replace(sel.text, better);
        p.ink = true;
      }
      traj('ok', 'diff 已逐条采纳（快照已存）', '分叉点墨点已标记，可回看轨迹');
      toast(`「${kind}」已按 diff 逐条采纳 · 快照已存`);
      render();
    });
  }

  function showSel(x, y, text, p) {
    closeSel();
    S.lastSel = { text, len: text.length, p };
    selEl = document.createElement('div');
    selEl.className = 'za-selmenu';
    selEl.style.left = Math.min(x, (root.clientWidth || 900) - 320) + 'px';
    selEl.style.top = Math.min(y + 8, (root.clientHeight || 700) - 190) + 'px';
    selEl.innerHTML = `<div class="t">已选中 ${text.length} 字 · 选区创作</div>
      <div class="row"><button class="mb hl" data-sel="拉深">拉深</button><button class="mb" data-sel="扩写">扩写</button><button class="mb" data-sel="缩写">缩写</button><button class="mb" data-sel="改写">改写</button><button class="mb" data-sel="去AI味改写">去AI味改写</button></div>

    root.appendChild(selEl);
    selEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-sel]');

      p.items.forEach(it => {

      if (S.screen === 'canon') S.canonCat = null;
      traj('info', '设定页已按类别分组', '改名撞名自动跳过，不丢文档');

    if (p.kind === 'clues') {
      p.items.forEach(it => S.clues.push({ id: it.id, t: it.t, p: it.p, act: it.p, pace: '刚埋下', paceC: 'p3', st: '埋下' }));
      traj('info', '伏笔台账已更新：' + p.items.map(i => i.id).join('、'));

    'ai-dossier': () => { aiRun('提取档案卡 · 第12章', [
        { k:'tool', t:'调用 propose_dossier', sub:'场景/人物/推进/悬念/关键细节（检索锚点）' },
        { k:'ok', t:'档案卡提案已登记 · 采纳后入跨全书检索库' },
      ]); return null; },
    'ai-outsync': () => { const p = addProp('大纲同步', 'outlineUpdates', '大纲更新提案（L04 搁置 + E11 补场）', now());
      aiRun('同步大纲', [
        { k:'info', t:'宿主对账（双字组匹配）→ AI 补充建议 → 合并一份提案' },
        { k:'ok', t:'大纲更新提案已登记 · 采纳后 L04 状态真实变化' },
      ]); return p; },
    'ai-audit': () => { aiRun('全书连贯性审查', [
        { k:'info', t:'本地 20 类扫描：死者复出/位置跳跃/人称漂移/台账烂账…' },
        { k:'ok', t:'发现 3 处（台账 2 · 偏移 1）——与埋点修复合并提案' },
      ]); return addProp('全书连贯性审查', 'clueFixes', '连贯性发现 + 修复动作（3 条）', now()); },
    'ai-pipeline': () => { const p = addProp('一键写作', 'draft', '第13章 草稿 v1（一键成章）', now());
      aiRun('一键成章 · 第13章', [
        { k:'info', t:'前置检查：骨架已批准 ✓（未批准时会停下并不代批）' },
        { k:'info', t:'写草稿 → 一致性审查 → 去AI味，自动串到底' },
        { k:'ok', t:'全产出进收件箱 · 停在「采纳」之前', sub:'采纳草稿 = 自动快照后写入正文' },
      ]); return p; },
  };

  function addProp(cap, kind, title, meta, extra) {
    const p = { id: 'p' + Math.random().toString(36).slice(2, 8), cap, kind, title, st: '待确认', meta, ...(extra || {}) };
    S.proposals.unshift(p); S.propTotal++;
    if (S.screen === 'inbox') render();
    return p;
  }

  root.addEventListener('click', (e) => {
    const actEl = e.target.closest('[data-act]');
    if (!actEl) { if (selEl && !selEl.contains(e.target)) closeSel(); return; }
    const act = actEl.getAttribute('data-act');
    const id = actEl.getAttribute('data-id');

    if (act === 'nav') { S.screen = actEl.getAttribute('data-screen'); ensureDSH(); render(); return; }
    if (act === 'open-book') { S.screen = 'editor'; S.chapter = 12; render(); return; }
    if (act === 'open-ch') { S.screen = 'editor'; S.chapter = Number(actEl.getAttribute('data-n')); render(); return; }
    if (act === 'new-book') { toast('新建向导：书名/题材 chips/一句话核心 → 搭框架提案（原型略）'); return; }
    if (act === 'dock-toggle') { S.dockOpen = false; render(); toast('轨迹面板已收起——顶部「轨迹」按钮或 ⌘⇧J 呼回'); return; }
    if (act === 'focus-toggle') { S.focus = !S.focus; render(); if (S.focus) toast('专注模式：只留稿纸（侧栏/轨迹退场）'); return; }
    if (act === 'dock-tab') { S.dockTab = actEl.getAttribute('data-t'); renderDock(); return; }
    if (act === 'canon-cur') { S.canonCur = actEl.getAttribute('data-t'); render(); return; }

    if (act === 'ghost') {
      const p = Number(actEl.getAttribute('data-p'));
      const s = S.ghostSentences[S.ghostIdx % S.ghostSentences.length];
      S.ghost = { para: p, s }; S.ghostPara = p;
      ensureDSH();
      aiRun('续写幽灵', [ { k:'info', t:'轻量请求：1-2 句接续 · 不进收件箱', sub:'Tab 采纳即转正；Esc / 继续打字作废' } ]);
      render();
      return;
    }
    if (act === 'branch-gen') {
      ensureDSH();
      aiRun('分支 · 三个走向', [ { k:'info', t:'读最近 2 章 + 未回收伏笔 → 生成 3 个走向（各 80-150 字）' } ]);
      S.branchSet++; S.branchSel = null; S.branchSelDraft = null;
      S.branches = S.branchPool[S.branchSet % S.branchPool.length];
      render(); return;
    }
    if (act === 'branch-reroll') {
      S.branchSet++; S.branchSel = null; S.branchSelDraft = null;
      S.branches = S.branchPool[S.branchSet % S.branchPool.length];
      toast('换一批：重新生成 3 个走向');
      aiRun('分支 · 换一批', [ { k:'info', t:'重生成 3 个走向' } ]);
      render(); return;
    }
    if (act === 'branch-none') { S.branches = null; S.branchSel = null; S.branchSelDraft = null; render(); return; }
    if (act === 'branch-pick') {
      const i = Number(actEl.getAttribute('data-i'));
      S.branchSel = i;
      const b = S.branches[i];
      const el = actEl.closest('.za-bcard'); if (el) el.classList.add('picking');
      setTimeout(() => {
        S.branchSelDraft = b; S.branches = null;
        const p = addProp('一键写作', 'draft', '第13章 草稿 v1（分支「' + b.k + '」展开）', now(), { src: b.k });
        aiRun('分支展开 · ' + b.k, [
          { k:'info', t:'按选中走向展开为完整段落草稿（' + b.x.length * 4 + ' 字左右）' },
          { k:'ok', t:'草稿提案已登记 · 采纳才进正文', sub:'铁律：展开也不直接落盘' },
        ]);
        render();
      }, 420);
      render(); return;
    }

    if (act === 'prop-accept') {
      const p = S.proposals.find(x => x.id === id);
      if (p) { applyProposal(p); render(); }
      return;
    }
    if (act === 'prop-reject') { rejectModal(id); return; }
    if (act === 'reject-confirm') {
      const p = S.proposals.find(x => x.id === id);
      const reason = ($('za-reason') || {}).value || '';
      if (p) { p.st = '已拒绝'; p.meta = now() + ' · 已拒收'; p.reason = reason || '（未填）'; S.rejectN++; }
      $('za-layers').innerHTML = '';
      toast('已拒收 · 理由将回灌同类能力的下一次生成');
      render(); return;
    }
    if (act === 'modal-close') { $('za-layers').innerHTML = ''; return; }

    if (act === 'test-conn') {
      S.testState = 'testing'; render();
      setTimeout(() => { S.testState = Math.random() > 0.25 ? 'ok' : 'fail'; render(); }, 900);
      return;
    }

    if (AI_DEFS[act]) {
      ensureDSH();
      AI_DEFS[act]();
      render();
      return;
    }
  });

  /* 选区 → 选区菜单 */
  root.addEventListener('mouseup', (e) => {
    if (S.screen !== 'editor') return;
    if (e.target.closest('.za-selmenu')) return;
    const sel = window.getSelection();
    const text = sel ? String(sel).trim() : '';
    if (text.length >= 4 && sel.rangeCount) {
      const range = sel.getRangeAt(0);
      const prose = document.getElementById('za-prose');
      if (prose && prose.contains(range.commonAncestorContainer)) {
        const rect = range.getBoundingClientRect();
        const rroot = root.getBoundingClientRect();
        showSel(rect.left - rroot.left + 40, rect.top - rroot.top + 30, text, 1);
      }
    } else if (selEl && !selEl.contains(e.target)) {
      closeSel();
    }
  });

  /* Tab / Esc 幽灵采纳 */
  document.addEventListener('keydown', (e) => {
    if (S.ghost && S.screen === 'editor') {
      if (e.key === 'Tab') {
        e.preventDefault();
        const p = S.prose[S.ghost.para];
        if (p) {
          p.t += S.ghost.s; p.ink = true;
          S.ghostIdx++;
          S.ghost = { para: S.ghost.para, s: S.ghostSentences[S.ghostIdx % S.ghostSentences.length] };
          traj('ok', '幽灵句已采纳（转正 · 墨点标记）', '自动请求下一句——像拉一条句子溪流');
          toast('已采纳一句 · 下一句已到（Esc 可停）');
        }
        render();
      } else if (e.key === 'Escape') {
        S.ghost = null; S.ghostIdx = 0;
        traj('info', '幽灵续写作废（Esc）');
        render();
      }
    }
  });

  window.__S = S; window.__dbg = { traj, applyProposal, addProp };
  render();
})();
</script>
</div>
